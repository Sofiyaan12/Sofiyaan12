<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-bg { fill: #050a06; }
      .frame { fill: none; stroke: #2fbf6f; stroke-width: 1.5; opacity: 0.8; }
      .heading { font-family: 'Consolas','Courier New',monospace; font-size: 13px; fill: #4dff9f; font-weight: bold; }
      .card { fill: #0a140d; stroke: #2fbf6f; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .card-title { font-family: 'Consolas','Courier New',monospace; font-size: 14px; fill: #7fffb0; text-anchor: middle; font-weight: bold; }
      .card-sub { font-family: 'Consolas','Courier New',monospace; font-size: 11px; fill: #3f8f66; text-anchor: middle; }
      .glow { animation: pulseGlow 3.6s ease-in-out infinite; }
      @keyframes pulseGlow {
        0%   { stroke: #2fbf6f; filter: drop-shadow(0 0 0px transparent); }
        15%  { stroke: #4dff9f; filter: drop-shadow(0 0 12px #4dff9f); }
        30%  { stroke: #2fbf6f; filter: drop-shadow(0 0 0px transparent); }
        100% { stroke: #2fbf6f; filter: drop-shadow(0 0 0px transparent); }
      }
      .icon { fill: none; stroke: #3f8f66; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="220" class="term-bg"/>
  <rect x="8" y="8" width="884" height="204" class="frame" rx="6"/>
  <text x="30" y="34" class="heading">&gt; PROJECTS.exe &#8212; slots loading</text>

  <!-- Card 1 -->
  <g>
    <rect x="30" y="55" width="260" height="140" rx="10" class="card glow" style="animation-delay:0s"/>
    <path class="icon" d="M140,95 l20,20 l-20,20 M170,135 l20,-20 l-20,-20" transform="translate(0,0)"/>
    <text x="160" y="150" class="card-title">PROJECT SLOT 01</text>
    <text x="160" y="170" class="card-sub">// awaiting Phase 6 build</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="320" y="55" width="260" height="140" rx="10" class="card glow" style="animation-delay:1.2s"/>
    <path class="icon" d="M430,95 l20,20 l-20,20 M460,135 l20,-20 l-20,-20"/>
    <text x="450" y="150" class="card-title">PROJECT SLOT 02</text>
    <text x="450" y="170" class="card-sub">// awaiting Phase 6 build</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="610" y="55" width="260" height="140" rx="10" class="card glow" style="animation-delay:2.4s"/>
    <path class="icon" d="M720,95 l20,20 l-20,20 M750,135 l20,-20 l-20,-20"/>
    <text x="740" y="150" class="card-title">PROJECT SLOT 03</text>
    <text x="740" y="170" class="card-sub">// awaiting Phase 6 build</text>
  </g>
</svg>
