<svg width="1200" height="350" viewBox="0 0 1200 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="20"
        fill="url(#bg)"
        stroke="#00f5ff"
        stroke-opacity="0.35"/>

  <!-- Grid -->
  <g stroke="#00f5ff" stroke-opacity="0.08">

    <path d="M0 70 H1200"/>
    <path d="M0 140 H1200"/>
    <path d="M0 210 H1200"/>
    <path d="M0 280 H1200"/>

    <path d="M100 0 V350"/>
    <path d="M200 0 V350"/>
    <path d="M300 0 V350"/>
    <path d="M400 0 V350"/>
    <path d="M500 0 V350"/>
    <path d="M600 0 V350"/>
    <path d="M700 0 V350"/>
    <path d="M800 0 V350"/>
    <path d="M900 0 V350"/>
    <path d="M1000 0 V350"/>
    <path d="M1100 0 V350"/>

  </g>

  <!-- Animated scanning line -->
  <rect x="0" y="0" width="1200" height="3"
        fill="#00f5ff"
        opacity="0.7">

    <animate
      attributeName="y"
      from="0"
      to="347"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Main title -->

  <text x="600" y="130"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="700"
        filter="url(#glow)">

    MOHAMMED SOFIYAAN

    <animate
      attributeName="opacity"
      values="0;1;1;0.85;1"
      dur="3s"
      repeatCount="indefinite"/>

  </text>

  <!-- Subtitle -->

  <text x="600" y="180"
        text-anchor="middle"
        fill="url(#cyan)"
        font-family="monospace"
        font-size="24"
        font-weight="600">

    AI / ML ENGINEER

    <animate
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="2s"
      repeatCount="indefinite"/>

  </text>

  <!-- Skills -->

  <text x="600" y="225"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="monospace"
        font-size="15">

    PYTHON  •  MACHINE LEARNING  •  DEEP LEARNING  •  GENAI  •  RAG

  </text>

  <!-- Status -->

  <circle cx="470" cy="275" r="6"
          fill="#00ffa3">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.2s"
      repeatCount="indefinite"/>

  </circle>

  <text x="485" y="281"
        fill="#00ffa3"
        font-family="monospace"
        font-size="15">

    SYSTEM ONLINE

  </text>

  <!-- Decorative corner -->

  <path d="M30 50 V25 H55"
        fill="none"
        stroke="#00f5ff"
        stroke-width="2"/>

  <path d="M1170 300 V325 H1145"
        fill="none"
        stroke="#00ffa3"
        stroke-width="2"/>

</svg>
