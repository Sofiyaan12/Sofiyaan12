name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sofiyaan12
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Copy Snake to assets
        run: |
          git clone https://github.com/Sofiyaan12/Sofiyaan12.git repo
          cp dist/github-contribution-grid-snake.svg repo/assets/
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          git commit -m "Update contribution snake" || exit 0
          git push
