<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-bg { fill: #050a06; }
      .frame { fill: none; stroke: #2fbf6f; stroke-width: 1.5; opacity: 0.8; }
      .label { font-family: 'Consolas','Courier New',monospace; font-size: 11px; fill: #7fffb0; text-anchor: middle; }
      .label-active { font-family: 'Consolas','Courier New',monospace; font-size: 11px; fill: #4dff9f; font-weight: bold; text-anchor: middle; }
      .heading { font-family: 'Consolas','Courier New',monospace; font-size: 13px; fill: #4dff9f; font-weight: bold; }
      .track-bg { fill: #10241a; }
      .track-fill { fill: #2fbf6f; }
      .node-done { fill: #2fbf6f; }
      .node-active { fill: #4dff9f; }
      .node-todo { fill: #10241a; stroke: #2fbf6f; stroke-width: 1.5; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { r: 9; opacity: 1; }
        50% { r: 13; opacity: 0.6; }
      }
    </style>
  </defs>

  <rect width="900" height="140" class="term-bg"/>
  <rect x="8" y="8" width="884" height="124" class="frame" rx="6"/>

  <text x="30" y="34" class="heading">&gt; ROADMAP_STATUS.exe</text>

  <!-- track -->
  <rect x="60" y="65" width="780" height="8" rx="4" class="track-bg"/>
  <rect x="60" y="65" width="780" height="8" rx="4" class="track-fill">
    <animate attributeName="width" from="0" to="97" dur="1.5s" begin="0.3s" fill="freeze"/>
  </rect>

  <!-- 6 phase nodes evenly spaced along x=60 to x=840 -->
  <!-- Phase 1: Python (mid-way -> active, pulsing) -->
  <circle cx="60" cy="69" r="9" class="node-active pulse"/>
  <text x="60" y="105" class="label-active">Python</text>

  <!-- Phase 2: SQL / Pandas -->
  <circle cx="216" cy="69" r="8" class="node-todo"/>
  <text x="216" y="105" class="label">SQL / Pandas</text>

  <!-- Phase 3: Statistics -->
  <circle cx="372" cy="69" r="8" class="node-todo"/>
  <text x="372" y="105" class="label">Statistics</text>

  <!-- Phase 4: Machine Learning -->
  <circle cx="528" cy="69" r="8" class="node-todo"/>
  <text x="528" y="105" class="label">Machine Learning</text>

  <!-- Phase 5: Specialization -->
  <circle cx="684" cy="69" r="8" class="node-todo"/>
  <text x="684" y="105" class="label">Gen AI / ML Eng</text>

  <!-- Phase 6: Portfolio + Jobs -->
  <circle cx="840" cy="69" r="8" class="node-todo"/>
  <text x="840" y="105" class="label">Portfolio + Jobs</text>

  <text x="60" y="128" class="label-active" text-anchor="start">&#9656; Currently mid-way through Phase 1: Python Foundations</text>
</svg>
