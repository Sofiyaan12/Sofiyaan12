<svg width="1200" height="620" viewBox="0 0 1200 620"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020807"/>
    <stop offset="100%" stop-color="#001510"/>
  </linearGradient>

  <!-- Green glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Photo -->
  <clipPath id="photoClip">
    <rect x="35" y="135" width="430" height="390" rx="12"/>
  </clipPath>

  <!-- Scan gradient -->
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00ff9d" stop-opacity="0"/>
    <stop offset="45%" stop-color="#00ff9d" stop-opacity=".8"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="55%" stop-color="#00ff9d" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
  </linearGradient>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="620" rx="22" fill="url(#bg)"/>

<!-- OUTER BORDER -->

<rect x="8" y="8" width="1184" height="604"
      rx="20"
      fill="none"
      stroke="#00ff9d"
      stroke-width="2"
      opacity=".9"
      filter="url(#glow)"/>

<!-- HEADER -->

<rect x="8" y="8" width="1184" height="70"
      rx="20"
      fill="#03120e"
      stroke="#00ff9d"
      stroke-width="1"/>

<!-- MAC DOTS -->

<circle cx="35" cy="43" r="8" fill="#ff5f56"/>
<circle cx="60" cy="43" r="8" fill="#ffbd2e"/>
<circle cx="85" cy="43" r="8" fill="#27c93f"/>

<!-- HEADER -->

<text x="115" y="49"
      fill="#00ff9d"
      font-family="monospace"
      font-size="22"
      font-weight="bold">
  PROFILE_SCAN.exe
</text>

<text x="980" y="49"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  ● LIVE
</text>

<!-- TERMINAL LINE -->

<text x="35" y="110"
      fill="#00ff9d"
      font-family="monospace"
      font-size="17">
  &gt; INITIALIZING IDENTITY SCAN...
</text>

<text x="1030" y="110"
      fill="#00ff9d"
      font-family="monospace"
      font-size="14">
  [ACCESS_GRANTED]
</text>

<!-- PHOTO FRAME -->

<rect x="35" y="135"
      width="430"
      height="390"
      rx="12"
      fill="#00100c"
      stroke="#00ff9d"
      stroke-width="2"/>

<!-- YOUR PHOTO -->

<image
  href="profile.jpg"
  x="35"
  y="135"
  width="430"
  height="390"
  preserveAspectRatio="xMidYMid slice"
  clip-path="url(#photoClip)"
  opacity="0.95"/>

<!-- GREEN OVERLAY -->

<rect x="35" y="135"
      width="430"
      height="390"
      rx="12"
      fill="#00ff9d"
      opacity=".06"/>

<!-- SCAN LINE -->

<rect x="35" y="135"
      width="430"
      height="8"
      fill="url(#scan)"
      opacity=".9">

  <animate
    attributeName="y"
    values="135;517;135"
    dur="3.5s"
    repeatCount="indefinite"/>

</rect>

<!-- CORNER MARKERS -->

<path d="M55 165 V150 H75"
      fill="none"
      stroke="#00ff9d"
      stroke-width="3"/>

<path d="M425 165 V150 H405"
      fill="none"
      stroke="#00ff9d"
      stroke-width="3"/>

<path d="M55 495 V510 H75"
      fill="none"
      stroke="#00ff9d"
      stroke-width="3"/>

<path d="M425 495 V510 H405"
      fill="none"
      stroke="#00ff9d"
      stroke-width="3"/>

<!-- PHOTO STATUS -->

<rect x="55" y="455"
      width="250"
      height="45"
      fill="#00130e"
      opacity=".85"/>

<text x="70" y="475"
      fill="#00ff9d"
      font-family="monospace"
      font-size="13">
  FACE_DETECTED
</text>

<text x="70" y="493"
      fill="#8affd1"
      font-family="monospace"
      font-size="11">
  BIOMETRIC_SCAN // VERIFIED
</text>

<!-- RIGHT INFORMATION PANEL -->

<rect x="495" y="135"
      width="665"
      height="390"
      rx="12"
      fill="#00100c"
      stroke="#00ff9d"
      stroke-width="2"/>

<text x="525" y="175"
      fill="#00ff9d"
      font-family="monospace"
      font-size="22"
      font-weight="bold">
  &gt; SYSTEM_INFORMATION
</text>

<!-- INFORMATION -->

<text x="525" y="225"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; NAME
</text>

<text x="710" y="225"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  Mohammed Sofiyaan
</text>

<text x="525" y="265"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; USERNAME
</text>

<text x="710" y="265"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  Sofiyaan12
</text>

<text x="525" y="305"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; ROLE
</text>

<text x="710" y="305"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  AI / ML Engineer
</text>

<text x="525" y="345"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; STATUS
</text>

<text x="710" y="345"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  BUILDING | LEARNING | GROWING
</text>

<text x="525" y="385"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; STACK
</text>

<text x="710" y="385"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  Python | ML | Deep Learning
</text>

<text x="710" y="410"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  GenAI | RAG | Agentic AI
</text>

<text x="525" y="450"
      fill="#00ff9d"
      font-family="monospace"
      font-size="16">
  &gt; MISSION
</text>

<text x="710" y="450"
      fill="#d9fff0"
      font-family="monospace"
      font-size="16">
  BUILD. DEPLOY. IMPACT.
</text>

<!-- FOOTER -->

<line x1="35" y1="550"
      x2="1160" y2="550"
      stroke="#00ff9d"
      stroke-width="1"/>

<circle cx="48" cy="580" r="8"
        fill="#00ff9d">
  <animate
    attributeName="opacity"
    values="1;.2;1"
    dur="1.2s"
    repeatCount="indefinite"/>
</circle>

<text x="70" y="586"
      fill="#00ff9d"
      font-family="monospace"
      font-size="15">
  SYSTEM STATUS: ONLINE
</text>

<text x="800" y="586"
      fill="#507d70"
      font-family="monospace"
      font-size="13">
  // BUILDING THE FUTURE WITH AI //
</text>

</svg>
