<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-bg { fill: #050a06; }
      .frame { fill: none; stroke: #2fbf6f; stroke-width: 1.5; opacity: 0.8; }
      .prompt { font-family: 'Consolas','Courier New',monospace; font-size: 14px; fill: #4dff9f; }
      .cmd { font-family: 'Consolas','Courier New',monospace; font-size: 14px; fill: #e9fff2; }
      .out { font-family: 'Consolas','Courier New',monospace; font-size: 13px; fill: #7fffb0; }
      .cursor { fill: #4dff9f; }
      .blink { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <rect width="900" height="260" class="term-bg"/>
  <rect x="8" y="8" width="884" height="244" class="frame" rx="6"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="450" y="33" text-anchor="middle" class="prompt">terminal &#8212; zsh</text>

  <g font-size="14">
    <!-- Line 1: whoami -->
    <text x="30" y="65" opacity="0">
      <tspan class="prompt">sofiyaan@dev</tspan><tspan class="cmd">:~$ whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="30" y="88" class="out" opacity="0">Mohammed Sofiyaan &#8212; AI/ML Engineer in Training
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.0s" fill="freeze"/>
    </text>

    <!-- Line 2: cat goals.txt -->
    <text x="30" y="116" opacity="0">
      <tspan class="prompt">sofiyaan@dev</tspan><tspan class="cmd">:~$ cat goals.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="30" y="139" class="out" opacity="0">&gt; Become a Gen AI / Agentic AI Engineer, Data Scientist, or ML Engineer
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="30" y="159" class="out" opacity="0">&gt; Learn every fundamental from scratch. No vibe-coding.
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.9s" fill="freeze"/>
    </text>

    <!-- Line 3: ls learning_phase/ -->
    <text x="30" y="187" opacity="0">
      <tspan class="prompt">sofiyaan@dev</tspan><tspan class="cmd">:~$ ls learning_phase/</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.6s" fill="freeze"/>
    </text>
    <text x="30" y="210" class="out" opacity="0">phase_01_python  [IN PROGRESS]
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.3s" fill="freeze"/>
    </text>

    <!-- Line 4: prompt with blinking cursor -->
    <text x="30" y="238" opacity="0">
      <tspan class="prompt">sofiyaan@dev</tspan><tspan class="cmd">:~$ </tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="5.0s" fill="freeze"/>
    </text>
    <rect x="175" y="227" width="9" height="15" class="cursor blink" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="5.1s" fill="freeze"/>
    </rect>
  </g>

</svg>
